spring:
  application:
    name: farma

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:farma_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.resend.com
    port: 587
    username: resend
    password: ${RESEND_API_KEY}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha

weather:
  api:
    key: ${WEATHER_API_KEY}
    base-url: ${WEATHER_API_BASE_URL:https://api.openweathermap.org/data/2.5/weather}

app:
  frontend:
    url: ${FRONTEND_URL:https://www.farma.com.ng}

jwt:
  secret: ${JWT_SECRET:3c9a6f8b5d2e7c4a1b0d9f8e7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d1e0f9a8b}
  expiration: ${JWT_EXPIRATION:86400000}